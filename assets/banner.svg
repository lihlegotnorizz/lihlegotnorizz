<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Lihle Naholo — Full Stack Developer</title>
  <desc id="description">A dark blue developer banner featuring Lihle Naholo's name and technologies.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B16"/>
      <stop offset="0.55" stop-color="#0A1426"/>
      <stop offset="1" stop-color="#101D36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#60A5FA" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#background)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="1010" cy="90" r="110" fill="#2563EB" opacity=".16" filter="url(#glow)"/>
  <circle cx="1010" cy="90" r="80" fill="none" stroke="#60A5FA" stroke-opacity=".18"/>
  <circle cx="1010" cy="90" r="54" fill="none" stroke="#60A5FA" stroke-opacity=".13"/>
  <path d="M935 112l-24 20 24 20M1085 112l24 20-24 20M1026 103l-32 58" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" opacity=".85"/>
  <rect x="72" y="67" width="5" height="186" rx="2.5" fill="url(#accent)"/>
  <text x="105" y="139" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="3">LIHLE NAHOLO</text>
  <text x="108" y="187" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="5">FULL STACK DEVELOPER</text>
  <path d="M108 210h430" stroke="#334155" stroke-width="1"/>
  <text x="108" y="244" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="1.2">JAVA  •  JAKARTA EE  •  JAVASCRIPT  •  PYTHON</text>
  <text x="1110" y="278" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2" text-anchor="end">SOUTH AFRICA · BUILDING WHAT'S NEXT</text>
</svg>
